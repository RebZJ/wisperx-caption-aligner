<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wisperx caption editor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>caption aligner</h1>
            <p id="projectMeta">loading project</p>
          </div>
        </div>
        <div class="transport">
          <button id="playButton" class="primary">Play</button>
          <div id="timeReadout" class="time-readout">00:00.000 / 00:00.000</div>
        </div>
        <div class="actions">
          <label class="field compact">
            <span>nudge</span>
            <input id="nudgeInput" type="number" min="1" step="1" value="20" />
            <span>ms</span>
          </label>
          <button id="nudgeLeft" title="Move selected captions earlier">-</button>
          <button id="nudgeRight" title="Move selected captions later">+</button>
          <label class="field">
            <span>zoom</span>
            <input id="zoomInput" type="range" min="0.035" max="0.42" step="0.005" value="0.11" />
          </label>
          <button id="downloadButton">Export</button>
          <button id="saveButton" class="primary">Save</button>
        </div>
      </section>

      <section class="stage">
        <div class="stage-header">
          <div>
            <span id="selectionReadout" class="pill">0 selected</span>
            <span id="status" class="status">ready</span>
          </div>
          <div class="keyline"></div>
        </div>
        <div id="timelineScroll" class="timeline-scroll">
          <div id="timeline" class="timeline">
            <canvas id="waveform" class="waveform"></canvas>
            <div id="ruler" class="ruler"></div>
            <div id="captionLayer" class="caption-layer"></div>
            <div id="scrubber" class="scrubber"></div>
            <div id="marquee" class="marquee hidden"></div>
          </div>
        </div>
      </section>

      <audio id="audio" preload="auto"></audio>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
