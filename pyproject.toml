[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wisperx-caption-aligner"
version = "0.1.0"
description = "Lightweight CLI for aligning canonical lyrics to audio with WhisperX word timings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RebZJ" }]
keywords = ["whisperx", "captions", "lyrics", "remotion", "karaoke"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wisperx-caption-aligner = "wisperx_caption_aligner.cli:main"

[project.urls]
Homepage = "https://github.com/RebZJ/wisperx-caption-aligner"
Repository = "https://github.com/RebZJ/wisperx-caption-aligner"
Issues = "https://github.com/RebZJ/wisperx-caption-aligner/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/wisperx_caption_aligner"]

[tool.hatch.build.targets.wheel.force-include]
"src/wisperx_caption_aligner/web" = "wisperx_caption_aligner/web"
